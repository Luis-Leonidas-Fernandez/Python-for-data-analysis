[project]
name = "python-for-data-analysis-study"
version = "0.1.0"
description = "Personal data science and AI study environment based on Python for Data Analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Luis Fernández" },
]
dependencies = [
    "numpy",
    "pandas==2.0.3",
    "matplotlib",
    "lxml",
    "seaborn",
    "statsmodels",
    "scipy",
    "patsy",
    "scikit-learn",
    "beautifulsoup4",
    "jupyter",
    "ipython",
    "requests",
    "sqlalchemy",
    "pytz",
]

[project.optional-dependencies]
dev = [
    "jupyter",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
