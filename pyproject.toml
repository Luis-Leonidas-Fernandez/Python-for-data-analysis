[project]
name = "python-for-data-analysis-study"
version = "0.1.0"
description = "Personal data science and AI study environment based on Python for Data Analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Luis Fernández" },
]
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.5",
    "scipy==1.17.1",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "requests==2.34.2",
    "sqlalchemy==2.0.52",
    "pytz==2026.3.post1",
    "statsmodels==0.15.0",
    "patsy==1.0.3",
    "scikit-learn==1.9.1",
    "jupyter==1.1.1",
    "ipython==9.17.1",
]

[project.optional-dependencies]
dev = [
    "jupyter",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
